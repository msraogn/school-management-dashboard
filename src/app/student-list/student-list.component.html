<section class="page">
  <div class="card">
    <div class="page-header">
      <h2>Student List</h2>
      <div class="badge">Home</div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Grade</th>
            <th>Roll No.</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of students">
            <td>{{ student.name }}</td>
            <td>{{ student.grade }}</td>
            <td>{{ student.rollNumber }}</td>
            <td>{{ student.status }}</td>
            <td>
              <a [routerLink]="['/students', student.id]" class="details-link">View Details</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
