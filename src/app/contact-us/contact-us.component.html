<section class="page">
  <div class="card">
    <p class="eyebrow">Contact Us</p>
    <h2>We’re here to help</h2>

    <div class="info-list">
      <div class="info-box">
        <label>Email</label>
        <p>{{ contactDetails.email }}</p>
      </div>
      <div class="info-box">
        <label>Phone</label>
        <p>{{ contactDetails.phone }}</p>
      </div>
      <div class="info-box">
        <label>Address</label>
        <p>{{ contactDetails.address }}</p>
      </div>
    </div>
  </div>
</section>
